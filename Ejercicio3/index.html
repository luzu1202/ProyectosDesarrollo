<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de servicios</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Nuestros servicios</h1>
  </header>

  <main>
    <section class="galeria" aria-label="Servicios disponibles">
      <article class="tarjeta">
        <div class="tarjeta-icono" aria-hidden="true">💻</div>
        <h2>Desarrollo Web</h2>
        <p>Creamos sitios rápidos, accesibles y responsivos.</p>
      </article>
      <article class="tarjeta">
        <div class="tarjeta-icono">🎨</div>
        <h2>Diseño UI/UX</h2>
        <p>Diseñamos interfaces claras centradas en el usuario.</p>
      </article>
      <article class="tarjeta">
        <div class="tarjeta-icono">🔒</div>
        <h2>Seguridad</h2>
        <p>Protegemos tus datos con buenas prácticas modernas.</p>
      </article>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="anio"></span> Mi Empresa</p>
  </footer>
  <script>
    document.getElementById("anio").textContent = new Date().getFullYear();
  </script>
</body>
</html>
